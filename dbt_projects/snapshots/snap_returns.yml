# SCD Type 2 history of returns. The timestamp strategy relies on fact_returns.updated_at
# (set by scripts/load_raw_data.py). There is one return per sale, so sales_id is the key;
# the unique test on silver_returns.sales_id guards that assumption.
snapshots:
  - name: snap_returns
    relation: source('source', 'fact_returns')
    config:
      strategy: timestamp
      unique_key: sales_id
      updated_at: updated_at
