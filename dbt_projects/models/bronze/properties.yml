version: 2

models:
  - name: bronze_date
    config:
      materialized: view

  - name: bronze_products
    config:
      materialized: view

  - name: bronze_sales
    columns:
      - name: sales_id
        data_tests:
          - not_null
          - unique
      - name: quantity
        data_tests:
          - non_negative
      - name: unit_price
        data_tests:
          - non_negative
      - name: gross_amount
        data_tests:
          - non_negative
      - name: discount_amount
        data_tests:
          - non_negative
      - name: net_amount
        data_tests:
          - non_negative

  - name: bronze_store
    columns:
      - name: store_sk
        data_tests:
          - not_null
          - unique
      - name: store_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
              config:
                severity: warn  # a new store should be reviewed, not block the pipeline
