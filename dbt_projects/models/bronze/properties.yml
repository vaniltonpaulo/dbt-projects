version: 2

models:
  - name: bronze_date
    config:
      materialized: view
  - name: bronze_products
    config:
      materialized: view
  - name: bronze_sales
    columns:
      - name: sales_id
        tests:
          - not_null
          - unique
      - name: gross_amount
        data_tests:
        - generic_non_negative
            
    
  - name: bronze_store
    columns:
      - name: store_sk
        tests:
          - not_null
          - unique
      - name: store_name
        data_tests:
        - accepted_values:
            arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
            config:
                    # In case you want to change the severity of the test, you can do it here. 
                    # The default is error, but you can change it to warn or info. 
                severity: warn   
   