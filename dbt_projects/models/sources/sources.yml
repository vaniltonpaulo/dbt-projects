version: 2

sources:
  - name: source
    description: "Raw retail data loaded from CSV by scripts/load_raw_data.py."
    database: '{{ target.dbname }}'
    # Raw tables live in `public` in the dev database and in `source` in the prod database.
    schema: "{{ 'source' if target.name == 'prod' else 'public' }}"
    tables:
      - name: dim_customer
      - name: dim_date
      - name: dim_product
      - name: dim_store
      - name: fact_returns
      - name: fact_sales
