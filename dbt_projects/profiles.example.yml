# Copy to ~/.dbt/profiles.yml and export DBT_PG_PASSWORD (plus the other variables if the
# defaults don't match your setup). Credentials are read from the environment, never committed.
dbt_projects:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PG_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_PG_USER', 'postgres') }}"
      password: "{{ env_var('DBT_PG_PASSWORD') }}"
      dbname: source
      schema: dbt_dev
      threads: 4
    prod:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PG_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_PG_USER', 'postgres') }}"
      password: "{{ env_var('DBT_PG_PASSWORD') }}"
      dbname: Business_production
      schema: source
      threads: 4
