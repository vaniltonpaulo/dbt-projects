name: 'dbt_projects'
version: '1.0.0'

profile: 'dbt_projects'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Each medallion layer is written to its own schema (see macros/generate_schema.sql).
models:
  dbt_projects:
    bronze:
      +materialized: table
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

seeds:
  dbt_projects:
    +schema: bronze
